# 把上游 AAPS 自动同步到这个 fork
#
# 安装方法（不需要 git 基础，全程网页操作）：
#   1. 打开 https://github.com/icenik-29/AndroidAPS-4.0-beta
#   2. 右上角 "Add file" -> "Create new file"
#   3. 文件名填：.github/workflows/sync-aaps.yml
#   4. 把本文件全部内容粘进去，点 "Commit changes"
#   5. 打开仓库的 "Actions" 标签页，如果看到 "I understand my workflows,
#      go ahead and enable them"，点它启用（fork 里的定时任务默认是关的）
#
# 它每天跑一次，做两件事：
#   - 把上游所有分支和 tag 镜像到你的 fork（master 除外，留给这个工作流文件住）
#   - 维护一个固定名字的 latest-4.0 分支，永远指向最新的 4.0 正式线
#     （4.0.0-beta1 -> 4.0.0-rc1 -> 4.0.1 ... 自动跟着走，不用改这个文件）
#
# 注意：不要把这个 fork 的默认分支改成 latest-4.0，否则定时任务会因为
#       默认分支上找不到工作流文件而停掉。想在网页上看最新 4.0 代码，
#       在仓库首页的分支下拉框里切到 latest-4.0 就行。

name: Sync upstream AAPS

on:
  schedule:
    - cron: "0 3 * * *"   # 每天 03:00 UTC = 北京时间 11:00
  workflow_dispatch:       # 也可以在 Actions 页手动点 "Run workflow"

permissions:
  contents: write

concurrency:
  group: sync-upstream
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: 镜像上游到本 fork
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          # 完整 bare 克隆。不要加 --depth 1：--depth 会隐含 --single-branch，
          # 只能拿到 master 一个分支，下面的循环就空了。
          git clone --bare https://github.com/nightscout/AndroidAPS.git upstream.git
          cd upstream.git

          # ---------- 1) 所有分支（master 除外）+ 所有 tag ----------
          SPECS=""
          for ref in $(git for-each-ref --format='%(refname:short)' refs/heads/); do
            [ "$ref" = "master" ] && continue
            SPECS="$SPECS +refs/heads/$ref:refs/heads/$ref"
          done
          if [ -n "$SPECS" ]; then
            git push --force "$REMOTE" $SPECS
          else
            echo "上游没有 master 以外的分支"
          fi

          # tag 单独推，数量多，已存在会提示 up-to-date
          git push --force "$REMOTE" '+refs/tags/*:refs/tags/*' || true

          # ---------- 2) 维护 latest-4.0 ----------
          # 从 tag 里挑最新的 4.0：beta < rc < 正式版
          LATEST=$(git for-each-ref --format='%(refname:short)' refs/tags \
                   | grep -E '^4\.0\.' \
                   | python3 -c '
          import sys, re
          def key(v):
              v = v.strip()
              m = re.match(r"^(\d+)\.(\d+)\.(\d+)(?:[-.]([A-Za-z]+)\.?(\d*))?$", v)
              if not m:
                  return (-1,)
              major, minor, patch, stage, num = m.groups()
              if stage is None:
                  rank = 3                      # 正式版最高
              else:
                  rank = {"alpha": 0, "beta": 1, "rc": 2}.get(stage.lower(), 1)
              return (int(major), int(minor), int(patch), rank, int(num or 0))
          cands = [l for l in sys.stdin if l.strip()]
          if cands:
              print(max(cands, key=key).strip())
          ')

          if [ -z "$LATEST" ]; then
            echo "上游暂时没有 4.0.* tag，跳过 latest-4.0"
            exit 0
          fi

          echo "最新 4.0 版本: $LATEST"
          git push --force "$REMOTE" "refs/tags/${LATEST}:refs/heads/latest-4.0"
          echo "latest-4.0 -> ${LATEST}"
